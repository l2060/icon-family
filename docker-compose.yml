services:
  icon-family:
    build: .
    image: ${ICONFAMILY_IMAGE:-icon-family:latest}
    container_name: icon-family
    restart: unless-stopped
    ports:
      - "${ICONFAMILY_PORT:-3000}:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      STORAGE_DRIVER: sqlite
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminadmin}
    volumes:
      - ${ICONFAMILY_DATA_DIR:-/home/icon-family/data}:/data
