services:
  iconfamily:
    build: .
    container_name: iconfamily
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATA_DIR: /data
      STORAGE_DRIVER: sqlite
      ADMIN_USER: admin
      ADMIN_PASSWORD: adminadmin
    volumes:
      - iconfamily-data:/data

volumes:
  iconfamily-data:
